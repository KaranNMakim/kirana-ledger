[project]
name = "kirana-ledger"
version = "0.1.0"
description = "Voice-first udhaar ledger for small Indian shopkeepers, backed by a knowledge graph (POV)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "rdflib>=7.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::ResourceWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/kg/llm_anthropic.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
