# Seeded local-name catalogue for the demo shop. SYNTHETIC / approximate: prices are illustrative ₹ per unit.
# Aliases are transliterations a shopkeeper might say or a speech engine might emit. Every alias must be unique
# across products unless it is declared under generic_terms (shared words like "tel" or "dal").
# Fields: sku, name, cat(egory), unit, price, brand?, aliases {en, hi, gu, mr}

